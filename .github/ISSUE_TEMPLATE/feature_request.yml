name: Feature request
description: Suggest a focused improvement to FocusBoard.
title: "idea: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the user problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposed solution
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This idea can work without requiring an account or sending personal data to a server.
